name: CI - Testes e Cobertura

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master, 'release/**' ]

jobs:
  test:
    name: Rodar Testes Unitarios e Coverage
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/luminastock_test?schema=public"

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar testes e validar cobertura (>90%)
        run: npm run test:cov
